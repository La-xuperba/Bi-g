name: Crypto Signal Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAINS: solana,bsc
          SCAN_EVERY_MIN: 60
          TICK_SECONDS: 30
          MIN_SCORE_SIGNAL: 70
          RISK_MAX_SCORE: 45
          DIGEST_MIN_SCORE: 70
          DIGEST_ONLY_NEW: true
          DIGEST_SEND_EMPTY: false
        run: python crypto_signal_bot.py --once

      - name: Persist state
        run: |
          if [ -f state.json ]; then
            git config user.name 'crypto-signal-bot'
            git config user.email 'actions@github.com'
            git add state.json
            git diff --cached --quiet || git commit -m 'Update signal bot state'
            git push
          fi
