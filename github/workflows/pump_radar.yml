    return out

def tv_confirm(t):
    """TradingView TA summary, only when the DEX token is verifiably the Binance-listed asset (price match)."""
    if not ENABLE_TV: return None
    bp = binance_prices().get(t['symbol'].upper() + 'USDT')
    if not bp or not t['price'] or abs(t['price'] / bp - 1) > 0.05: return None
    try:
        from tradingview_ta import TA_Handler, Interval
        recs = []
        for iv in (Interval.INTERVAL_15_MINUTES, Interval.INTERVAL_1_HOUR):
            h = TA_Handler(symbol=t['symbol'].upper() + 'USDT', screener='crypto', exchange='BINANCE', interval=iv)
            recs.append(h.get_analysis().summary.get('RECOMMENDATION'))
        return recs
    except Exception as e:
        log(f'tradingview unavailable: {e}')
        return None

def btc_regime():
    if not ENABLE_BTC: return 0, 'BTC filter off'
    for base in BINANCE:
        d = get_json(f'{base}/api/v3/klines', {'symbol': 'BTCUSDT', 'interval': '1h', 'limit': 100}, retries=0)
        if isinstance(d, list) and len(d) > 55:
            c = [num(k[4]) for k in d]
            chg4 = (c[-1] / c[-5] - 1) * 100; e = ema(c, 50)[-1]; r = rsi(c)
            if chg4 < -2.5 or (c[-1] < e and r < 40): return -8, f'BTC risk-off (4h {chg4:+.1f}%, RSI {r:.0f})'
            if c[-1] > e and r >= 50: return 0, f'BTC supportive (RSI {r:.0f})'
            return -3, f'BTC neutral/weak (RSI {r:.0f})'
    return 0, 'BTC regime unavailable'

# --------------------------------------------------------------- scoring ---
def score_token(t, an, levels, safe, fund, tv):
    n = {}; s = {}
    # volume acceleration (18)
    accel = vol_accel(t); r = an['vol_ratio']
    s['volume'] = clip01((accel - 1) / 4) * 8 + clip01(((r if r else 1) - 1) / 4) * 10
    n['volume'] = f'1h volume {accel:.1f}x its prior-5h average' + (f'; last hour candles {r:.1f}x the 24h norm' if r else '')
    # buyer dominance (16)
    h1 = t['tx'].get('h1') or {}; br, br5 = buy_ratio(t, 'h1'), buy_ratio(t, 'm5')
    ub, us = h1.get('buyers', 0), h1.get('sellers', 0)
    p = clip01((br - .5) / .15) * 6 + clip01((br5 - .5) / .15) * 3
    if ub and us: p += clip01((ub / us - 1) / .6) * 4
    else: p += 2
    part = ub if ub else h1.get('buys', 0) * 0.5
    p += 3 if part >= 50 else 1.5 if part >= 20 else 0
    s['pressure'] = p
    n['pressure'] = f'buy ratio 1h {br * 100:.0f}% / 5m {br5 * 100:.0f}%' + (f'; unique buyers {ub:.0f} vs sellers {us:.0f}' if ub and us else '')
    # early-ness (15)
    c = t['chg']; h1c, h6c, h24c, m5c = c.get('h1', 0), c.get('h6', 0), c.get('h24', 0), c.get('m5', 0)
    s['early'] = ((7 if 1 <= h1c <= 12 else 4 if 0 <= h1c < 1 else 3 if 12 < h1c <= 20 else 0)
                  + (4 if h6c < 25 else 2 if h6c < 50 else 0) + (2 if h24c < 60 else 1 if h24c < 120 else 0) + (2 if m5c >= 0 else 0))
    n['early'] = f'move so far: 5m {m5c:+.1f}% | 1h {h1c:+.1f}% | 6h {h6c:+.1f}% | 24h {h24c:+.1f}%'
    # room + structure (15)
    st = 0
    if an['open_space']:
        st += 7 + (2 if an['breakout'] else 0)
        n['structure'] = 'open space above (no swing-high resistance in the last ~8 days)' + ('; breakout on volume' if an['breakout'] else '')
    else:
        room = an['room']; st += 9 if room >= 25 else 7 if room >= 15 else 4 if room >= 8 else 0
        n['structure'] = f'nearest resistance {fmt_p(an["res"])} is {room:.1f}% above'
    st += (2 if t['price'] > an['ema20'] else 0) + (2 if 50 <= an['rsi'] <= 72 else 0) + (2 if (an['squeeze'] or an['bb_break']) else 0)
    n['structure'] += f'; RSI {an["rsi"]:.0f}' + ('; above EMA20' if t['price'] > an['ema20'] else '') \
        + ('; Bollinger squeeze' if an['squeeze'] else '') + ('; Bollinger breakout' if an['bb_break'] else '')
    s['structure'] = st
    # liquidity sanity (9)
    liq = t['liq']; v24 = t['vol'].get('h24', 0); vl = v24 / liq if liq else 0
    fl = (t['fdv'] / liq) if (t['fdv'] and liq) else None
    s['liquidity'] = ((5 if liq >= 200000 else 4 if liq >= 100000 else 3 if liq >= 50000 else 2)
                      + (2 if 0.3 <= vl <= 8 else 0 if vl > 15 else 1) + (2 if (fl is not None and fl <= 20) else 1))
    n['liquidity'] = f'liquidity {usd(liq)}, 24h volume {usd(v24)} ({vl:.1f}x liquidity)'
    # safety (10)
    if safe is None:
        s['safety'] = 3; n['safety'] = 'safety NOT verified (no data)'
    else:
        s['safety'] = max(0, 10 - 3 * len(safe['danger']) - min(4, 2 * len(safe['warn'])))
        n['safety'] = f'{safe["src"]}: ' + ('clean' if not safe['danger'] and not safe['warn'] else
                                          '; '.join(safe['danger'][:3] + safe['warn'][:3]))
    # attention (6)
    age_h = (time.time() - t['created']) / 3600 if t['created'] else None
    a = (2 if '1h' in t['trend'] else 0) + (1 if '6h' in t['trend'] else 0) + (2 if t['socials'] >= 2 else 1 if t['socials'] == 1 else 0) \
        + (1 if age_h is not None and age_h < 24 else 0)
    s['attention'] = min(6, a)
    n['attention'] = ('GeckoTerminal trending ' + '/'.join(sorted(x for x in t['trend'] if x != 'new')) if (t['trend'] - {'new'}) else 'not trending')
    n['attention'] += f'; links {t["socials"]}' + ('; PAID BOOST (hype risk)' if t['boosted'] else '')
    # fundamentals (5)
    if fund:
        f_ = (1.5 if fund['d1'] > 0 else 0) + (1.5 if fund['d7'] > 5 else 0) + (1 if (fund['cat_mom'] or 0) > 0 else 0) \
            + (1 if fund['mcap_tvl'] and fund['mcap_tvl'] < 3 else 0)
        s['fundamental'] = f_
        n['fundamental'] = (f'DefiLlama {fund["name"]}: TVL {usd(fund["tvl"])} (1d {fund["d1"]:+.1f}%, 7d {fund["d7"]:+.1f}%)'
                            + (f'; {fund["cat"]} sector 7d avg {fund["cat_mom"]:+.1f}%' if fund['cat_mom'] is not None else ''))
    else:
        s['fundamental'] = 2; n['fundamental'] = 'no DeFi fundamentals (meme/utility token): neutral'
    # TradingView (6)
    if tv:
        s['tradingview'] = sum(3 if x == 'STRONG_BUY' else 2 if x == 'BUY' else 1 if x == 'NEUTRAL' else 0 for x in tv)
        n['tradingview'] = f'TradingView 15m/1h: {tv[0]}/{tv[1]}'
    else:
        s['tradingview'] = 2; n['tradingview'] = 'TradingView n/a (not a verified Binance-listed asset): neutral'
    total = sum(min(s[k], W[k]) for k in W)
    return total, s, n

def deep(t, ctx):
    net, pool = t['net'], t['pool']
    c15 = gt_ohlcv(net, pool, 'minute', 15, 200)
    c1h = gt_ohlcv(net, pool, 'hour', 1, 200)
    if len(c15) < 40 or len(c1h) < 14: return None, 'not enough candle history'
    price = t['price'] or c15[-1]['c']
    an = analyze(c15, c1h, price)
    if an['rsi'] > 82: return None, f'RSI {an["rsi"]:.0f} overbought'
    if an['ext_pct'] > MAX_EXT_EMA: return None, f'extended {an["ext_pct"]:.0f}% above EMA20'
    levels, why = make_levels(price, an)
    if not levels: return None, why
    safe = safety(t) if ENABLE_SAFETY else None
    if safe and safe['block']: return None, 'unsafe: ' + ', '.join(safe['danger'][:3] or ['rug flags'])
    fund = llama_match(t) if ENABLE_LLAMA else None
    tv = tv_confirm(t)
    total, s, n = score_token(t, an, levels, safe, fund, tv)
    total = max(0, total + ctx['btc_pen'])
    return {'tok': t, 'an': an, 'levels': levels, 'score': total, 'parts': s, 'notes': n, 'safe': safe, 'btc': ctx['btc_note']}, None

# -------------------------------------------------------------- messaging ---
def alert_text(r, serial):
    t, an, lv, n = r['tok'], r['an'], r['levels'], r['notes']
    net = NET_LABEL.get(t['net'], t['net'])
    stage = 'STRONG SETUP' if r['score'] >= STRONG_MIN else 'PRE-PUMP WATCH'
    risks = []
    if t['boosted']: risks.append('paid boost on DexScreener (hype can be the whole story)')
    if r['safe'] is None: risks.append('safety checks returned no data: verify the contract yourself')
    if an['hist_hours'] < 48: risks.append('very short price history')
    if t['liq'] < 100000: risks.append('thin liquidity: expect slippage and fast reversals')
    if r['btc'].startswith('BTC risk-off') or 'weak' in r['btc']: risks.append(r['btc'])
    if an['rsi'] > 72: risks.append(f'RSI already {an["rsi"]:.0f}')
    tps = ''.join(f"TP{i}: ${fmt_p(x)} (+{(x / lv['entry'] - 1) * 100:.0f}%)\n" for i, x in enumerate(lv['tps'], 1))
    return (f"\U0001F680 {stage} | ${t['symbol']} on {net} | #{serial}\n"
            f"Score {r['score']:.0f}/100 ({r['btc']})\n\n"
            f"Price ${fmt_p(t['price'])} | Liq {usd(t['liq'])} | MCap {usd(t['mcap'] or t['fdv'])}\n"
            f"{n['early']}\n\n"
            f"Why it's on the radar\n- {n['volume']}\n- {n['pressure']}\n- {n['structure']}\n- {n['attention']}\n- {n['fundamental']}\n- {n['tradingview']}\n"
            f"- {n['liquidity']}\n- {n['safety']}\n\n"
            f"Paper plan (not advice)\nEntry ${fmt_p(lv['entry'])}\nSL ${fmt_p(lv['sl'])} (-{lv['risk_pct']:.1f}%)\n{tps}\n"
            + ('Risks\n' + ''.join(f'- {x}\n' for x in risks) + '\n' if risks else '')
            + f"Token: {t['token']}\nhttps://dexscreener.com/{NET2DS.get(t['net'], t['net'])}/{t['pool']}\n"
            f"https://www.geckoterminal.com/{t['net']}/pools/{t['pool']}\n\n"
            "Momentum scanner output, not financial advice. Verify the contract and size positions small.")

# --------------------------------------------------------------- state ---
def load_state():
    try:
        with open(STATE_FILE) as fh: st = json.load(fh)
    except Exception:
        st = {}
    st.setdefault('alerts', {}); st.setdefault('signals', {}); st.setdefault('seq', 0)
    return st

def save_state(st):
    now = time.time()
    st['alerts'] = {k: v for k, v in st['alerts'].items() if now - v.get('ts', 0) < 3 * 86400}
    st['signals'] = {k: v for k, v in st['signals'].items() if v.get('status') == 'OPEN' or now - v.get('ts', 0) < 30 * 86400}
    with open(STATE_FILE, 'w') as fh: json.dump(st, fh)

def should_alert(st, key, score):
    old = st['alerts'].get(key)
    if not old: return True
    if time.time() - old['ts'] < COOLDOWN_H * 3600: return score >= old['score'] + JUMP
    return True

def register_signal(st, r, serial):
    t, lv = r['tok'], r['levels']
    st['signals'][f"{t['net']}:{t['token']}:{serial}"] = {
        'serial': serial, 'net': t['net'], 'token': t['token'], 'pool': t['pool'], 'sym': t['symbol'],
        'entry': lv['entry'], 'sl': lv['sl'], 'tps': lv['tps'], 'tp_done': 0, 'ts': time.time(), 'score': r['score'],
        'status': 'OPEN', 'hi': lv['entry'], 'lo': lv['entry'], 'last': lv['entry'], 'cp': {'1h': None, '6h': None, '24h': None}}

def update_signal(s, price):
    if not price: return
    now = time.time(); age_h = (now - s['ts']) / 3600
    s['hi'] = max(s['hi'], price); s['lo'] = min(s['lo'], price); s['last'] = price
    for cp, h in (('1h', 1), ('6h', 6), ('24h', 24)):
        if s['cp'].get(cp) is None and age_h >= h: s['cp'][cp] = (price / s['entry'] - 1) * 100
    head = f"\U0001F4CB Pump Radar signal #{s['serial']} ${s['sym']}"
    if price <= s['sl']:
        s['status'] = 'SL_AFTER_TP' if s['tp_done'] else 'SL_HIT'; s['closed_at'] = now
        post_tg(f"{head}: stop level touched (${fmt_p(price)}, entry ${fmt_p(s['entry'])})"
                + (f" after TP{s['tp_done']}" if s['tp_done'] else '') + '. First-observed price, not a confirmed fill.')
        return
    while s['tp_done'] < len(s['tps']) and price >= s['tps'][s['tp_done']]:
        s['tp_done'] += 1
        post_tg(f"{head}: TP{s['tp_done']} reached (${fmt_p(price)}, {(price / s['entry'] - 1) * 100:+.0f}% from entry). First-observed price.")
    if s['tp_done'] >= len(s['tps']): s['status'] = 'ALL_TP'; s['closed_at'] = now
    elif age_h > TRACK_HOURS: s['status'] = 'EXPIRED'; s['closed_at'] = now

def track(st):
    by = {}
    for s in st['signals'].values():
        if s['status'] == 'OPEN': by.setdefault(s['net'], []).append(s)
    for net, lst in by.items():
        chain = NET2DS.get(net, net)
        for i in range(0, len(lst), 30):
            b = lst[i:i + 30]
            d = get_json(f'{DS}/latest/dex/pairs/{chain}/' + ','.join(s['pool'] for s in b))
            px = {str(p.get('pairAddress', '')).lower(): num(p.get('priceUsd')) for p in ((d or {}).get('pairs') or [])}
            for s in b:
                try: update_signal(s, px.get(s['pool'].lower()))
                except Exception as e: log(f'track error: {e}')

def report(st):
    sigs = list(st['signals'].values())
    if not sigs: print('No signals recorded yet.'); return
    print(f'Signals: {len(sigs)}')
    for cp in ('1h', '6h', '24h'):
        v = [s['cp'][cp] for s in sigs if s['cp'].get(cp) is not None]
        if v: print(f'  {cp}: n={len(v)} avg {sum(v) / len(v):+.1f}% | positive {sum(1 for x in v if x > 0) / len(v) * 100:.0f}% | best {max(v):+.0f}% worst {min(v):+.0f}%')
    done = [s for s in sigs if s['status'] != 'OPEN']
    if done:
        tp1 = sum(1 for s in done if s['tp_done'] >= 1); sl = sum(1 for s in done if s['status'].startswith('SL'))
        print(f'  closed {len(done)}: TP1+ {tp1} ({tp1 / len(done) * 100:.0f}%), stop {sl} ({sl / len(done) * 100:.0f}%)')
    mx = [(s['hi'] / s['entry'] - 1) * 100 for s in sigs]
    print(f'  avg max run-up after signal {sum(mx) / len(mx):+.1f}%')

# ----------------------------------------------------------------- main ---
def run_once():
    st = load_state()
    pen, note = btc_regime(); log(note)
    ctx = {'btc_pen': pen, 'btc_note': note}
    track(st)
    toks = collect()
    ok, rej = [], {}
    for t in toks:
        why = pre_gate(t)
        if why:
            key = why.split(' ')[0]
            rej[key] = rej.get(key, 0) + 1
        else:
            ok.append(t)
    ok.sort(key=quick_rank, reverse=True)
    log(f'{len(toks)} candidates, {len(ok)} passed pre-gate, deep-scanning {min(DEEP_N, len(ok))}; pre-gate rejects: {rej}')
    results = []
    for t in ok[:DEEP_N]:
        try:
            r, why = deep(t, ctx)
        except Exception as e:
            log(f'deep {t["symbol"]}: {e}'); continue
        if r: results.append(r)
        else: log(f'rejected ${t["symbol"]}: {why}')
    results.sort(key=lambda r: r['score'], reverse=True)
    sent = 0
    for r in results:
        t = r['tok']; key = f"{t['net']}:{t['token']}"
        if r['score'] < ALERT_MIN or not should_alert(st, key, r['score']): continue
        serial = st['seq'] + 1
        if (TG_TOKEN and TG_CHAT) and not post_tg(alert_text(r, serial)):
            log(f'Telegram failed for ${t["symbol"]}; will retry next run'); continue
        if not (TG_TOKEN and TG_CHAT): print(alert_text(r, serial))
        st['seq'] = serial
        st['alerts'][key] = {'ts': time.time(), 'score': r['score']}
        register_signal(st, r, serial); sent += 1
    save_state(st)
    log(f'scored {len(results)}, alerts sent {sent}')
    return results

if __name__ == '__main__':
    if '--test-telegram' in sys.argv: post_tg('Pump Radar connected.')
    elif '--report' in sys.argv: report(load_state())
    elif '--once' in sys.argv: run_once()
    else:
        while True:
            try: run_once()
            except Exception as e: log(f'loop error: {e}')
            time.sleep(SCAN_EVERY_MIN * 60)
