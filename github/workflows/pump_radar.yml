
"""Pump Radar - free-source early-momentum scanner for DEX tokens.

Goal: surface tokens that show the *footprints* of an early pump (accelerating
volume + buyer dominance, price not yet run, room to move) and reject the ones
that would give little profit (resistance right above) or look unsafe.

Free sources (no API key, no paid plan, no logins):
  GeckoTerminal  trending/new pools, pool stats, OHLCV candles
  DexScreener    cross-check, socials, paid boosts, price tracking
  DefiLlama      protocol TVL growth + sector momentum (DeFi tokens only)
  TradingView    TA summary via the unofficial `tradingview-ta` package
                 (optional; only for tokens verified to be Binance-listed)
  RugCheck       Solana token risk report         (free, no key)
  honeypot.is    EVM honeypot / tax simulation    (free, no key)
  Binance public BTC regime filter + listing identity check (market data only)
Arkham is NOT used: it has no free public API.

Pipeline
  1 collect   trending (1h/6h) + new pools + DexScreener boosts/profiles
  2 pre-gate  liquidity, age, "already pumped", sell pressure
  3 deep      15m + 1h candles -> resistance, squeeze, EMA/RSI, ATR levels
  4 gates     TP1 must fit under resistance with R:R >= RR_MIN, not extended,
              safety checks (honeypot / rug risks)
  5 score     100 pts: volume 18, pressure 16, early-ness 15, structure 15,
              liquidity 9, safety 10, attention 6, fundamentals 5, TradingView 6
              (then BTC-regime penalty)
  6 alert     Telegram (English), cooldown + score-jump rule
  7 track     1h / 6h / 24h returns, TP/SL first-touch, `--report` hit-rate

Nothing here predicts pumps. It filters for early momentum with room to run.
Track the results (`--report`) before risking real money.
"""
