name: BINANCE GEMS Pre-Pump Radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-gems-prepump-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run BINANCE GEMS radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          POST_TO_SQUARE: 'false'
          SIGNAL_MIN_SCORE: '45'
          SQUARE_MIN_SCORE: '75'
          ALERT_COOLDOWN_MIN: '720'
          ENABLE_FUTURES_CONFIRMATION: 'true'
          ENABLE_DEFILLAMA: 'true'
          ENABLE_OUTCOME_MONITOR: 'false'
          BINANCE_MIN_24H_VOLUME_USD: '100000'
          STAGE1_TOP: '100'
          DEEP_SCAN_COUNT: '50'
          SCAN_EVERY_MIN: '5'
          TICK_SECONDS: '60'
          STATE_FILE: state_binance.json
        run: python crypto_signal_bot.py --once

      - name: Save state file
        if: always()
        run: |
          if [ -f state_binance.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state_binance.json
            git diff --cached --quiet || git commit -m "Update BINANCE GEMS radar state [skip ci]"
            git push
          fi
