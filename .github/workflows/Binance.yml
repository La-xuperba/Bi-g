name: Binance Spot Early Radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-spot-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Binance Spot radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: state_binance.json
          SCAN_EVERY_MIN: '5'
          TICK_SECONDS: '30'
          BINANCE_MIN_24H_VOLUME_USD: '500000'
          STAGE1_TOP: '80'
          DEEP_SCAN_COUNT: '24'
          SIGNAL_MIN_SCORE: '45'
          ALERT_COOLDOWN_MIN: '720'
          ENABLE_FUTURES_CONFIRMATION: 'true'
          ENABLE_DEFILLAMA: 'true'
        run: python crypto_signal_bot.py --once

      - name: Save state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state_binance.json || true
          git diff --cached --quiet || git commit -m 'Update Binance radar state'
          git push || true
