name: binance-scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Binance bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BINANCE_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: state_binance.json

          SCAN_EVERY_MIN: "15"
          TICK_SECONDS: "60"

          POST_TO_SQUARE: "false"
        run: python binance_bot.py --tick --force

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state_binance.json

          if ! git diff --cached --quiet; then
            git commit -m "update binance state"
            git pull --rebase
            git push
          fi
