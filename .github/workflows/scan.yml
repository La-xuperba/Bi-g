name: scan
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  binance-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Binance bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BINANCE_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: state_binance.json
          SCAN_EVERY_MIN: "30"
          DIGEST_EVERY_MIN: "30"
          DIGEST_ONLY_NEW: "true"
          DIGEST_SEND_EMPTY: "false"
          POST_TO_SQUARE: "false"
        run: python binance_bot.py --tick ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_binance.json
          git diff --cached --quiet || (git commit -m "update binance state" && git pull --rebase && git push)
