# ---------------------------------------------------------------- helpers ---
def log(x):
    x = str(x)
    if TG_TOKEN: x = x.replace(TG_TOKEN, '***')
    print(f"[{datetime.now(timezone.utc).strftime('%H:%M:%S')}] {x}", flush=True)

def num(x, d=0.0):
    try:
        v = float(x)
        return v if math.isfinite(v) else d
    except (TypeError, ValueError):
        return d

def clip01(x): return max(0.0, min(1.0, x))

def usd(x):
    x = num(x)
    for d, s in ((1e9, 'B'), (1e6, 'M'), (1e3, 'K')):
        if abs(x) >= d: return f'${x / d:.2f}{s}'
    return f'${x:.2f}'

def fmt_p(x):
    x = num(x)
    if x <= 0: return '0'
    if x >= 1: return f'{x:,.4f}'
    return f'{x:.{max(4, 3 - int(math.floor(math.log10(x))))}f}'

def iso_ts(s):
    try: return datetime.fromisoformat(str(s).replace('Z', '+00:00')).timestamp()
    except Exception: return 0.0

GAP = {'api.geckoterminal.com': 2.2, 'api.dexscreener.com': 0.3, 'api.rugcheck.xyz': 1.0,
       'api.honeypot.is': 1.0, 'api.llama.fi': 0.5, 'scanner.tradingview.com': 1.0}
_last = {}

def get_json(url, params=None, headers=None, timeout=15, retries=2):
    """Polite GET: per-host spacing (GeckoTerminal free = 30 calls/min), 429 backoff."""
    host = url.split('/')[2]
    for i in range(retries + 1):
        wait = _last.get(host, 0) + GAP.get(host, 0.3) - time.time()
        if wait > 0: time.sleep(wait)
        _last[host] = time.time()
        try:
            r = S.get(url, params=params, headers=headers, timeout=timeout)
            if r.status_code == 429:
                time.sleep(3 + i * 4); continue
            if r.status_code in (400, 403, 404, 451): return None
            r.raise_for_status()
            return r.json()
        except Exception as e:
            if i == retries: log(f'request failed {url.split("?")[0]}: {e}')
            else: time.sleep(1 + i)
    return None

def post_tg(text):
    if not TG_TOKEN or not TG_CHAT:
        print(text); return False
    ok = True
    for i in range(0, len(text), 3900):
        try:
            r = S.post(f'https://api.telegram.org/bot{TG_TOKEN}/sendMessage',
                       data={'chat_id': TG_CHAT, 'text': text[i:i + 3900], 'disable_web_page_preview': True}, timeout=15)
            ok &= r.ok
        except Exception as e:
            log(f'Telegram error: {e}'); ok = False
    return ok

def ema(v, n):
    if not v: return []
    a = 2 / (n + 1); out = [v[0]]
    for x in v[1:]: out.append(a * x + (1 - a) * out[-1])
    return out

def rsi(v, n=14):
    if len(v) < n + 2: return 50.0
    g, l = [], []
    for a, b in zip(v, v[1:]):
        d = b - a; g.append(max(d, 0)); l.append(max(-d, 0))
    ag, al = sum(g[:n]) / n, sum(l[:n]) / n
    for i in range(n, len(g)):
        ag = (ag * (n - 1) + g[i]) / n; al = (al * (n - 1) + l[i]) / n
    return 100.0 if al == 0 else 100 - 100 / (1 + ag / al)

# ------------------------------------------------------------ data: pools ---
def blank_tok(net, token, pool):
    return {'net': net, 'token': token, 'pool': pool, 'symbol': '', 'name': '', 'price': 0.0,
            'liq': 0.0, 'fdv': 0.0, 'mcap': 0.0, 'chg': {}, 'vol': {}, 'tx': {}, 'created': 0.0,
            'socials': 0, 'boosted': False, 'trend': set(), 'src': set()}

def gt_pools(net, path, params=None):
    p = dict(params or {}); p['include'] = 'base_token'
    d = get_json(f'{GT}/networks/{net}/{path}', p, headers=GT_HEADERS)
    if not isinstance(d, dict): return []
    inc = {x.get('id'): (x.get('attributes') or {}) for x in (d.get('included') or []) if isinstance(x, dict)}
    out = []
    for item in d.get('data') or []:
        try:
            a = item.get('attributes') or {}
            base_id = (((item.get('relationships') or {}).get('base_token') or {}).get('data') or {}).get('id', '')
            token = base_id.split('_', 1)[1] if '_' in base_id else ''
            if not token or not a.get('address'): continue
            t = blank_tok(net, token, a['address'])
            t['symbol'] = str((inc.get(base_id) or {}).get('symbol') or str(a.get('name', '')).split('/')[0]).strip()
            t['name'] = str((inc.get(base_id) or {}).get('name') or a.get('name', ''))
            t['price'] = num(a.get('base_token_price_usd'))
            t['liq'] = num(a.get('reserve_in_usd')); t['fdv'] = num(a.get('fdv_usd')); t['mcap'] = num(a.get('market_cap_usd'))
            t['chg'] = {k: num(v) for k, v in (a.get('price_change_percentage') or {}).items()}
            t['vol'] = {k: num(v) for k, v in (a.get('volume_usd') or {}).items()}
            for k, v in (a.get('transactions') or {}).items():
                v = v or {}
                t['tx'][k] = {'buys': num(v.get('buys')), 'sells': num(v.get('sells')),
                              'buyers': num(v.get('buyers')), 'sellers': num(v.get('sellers'))}
            t['created'] = iso_ts(a.get('pool_created_at'))
            t['src'].add('gt')
            out.append(t)
        except Exception:
            continue
    return out

def ds_to_tok(p, net):
    base = p.get('baseToken') or {}
    t = blank_tok(net, base.get('address', ''), p.get('pairAddress', ''))
    t['symbol'] = str(base.get('symbol', '')); t['name'] = str(base.get('name', ''))
    t['price'] = num(p.get('priceUsd')); t['liq'] = num((p.get('liquidity') or {}).get('usd'))
    t['fdv'] = num(p.get('fdv')); t['mcap'] = num(p.get('marketCap'))
    t['chg'] = {k: num(v) for k, v in (p.get('priceChange') or {}).items()}
    t['vol'] = {k: num(v) for k, v in (p.get('volume') or {}).items()}
    for k, v in (p.get('txns') or {}).items():
        if isinstance(v, dict):
            t['tx'][k] = {'buys': num(v.get('buys')), 'sells': num(v.get('sells')), 'buyers': 0.0, 'sellers': 0.0}
    t['created'] = num(p.get('pairCreatedAt')) / 1000
    info = p.get('info') or {}
    t['socials'] = len(info.get('socials') or []) + len(info.get('websites') or [])
    t['boosted'] = num((p.get('boosts') or {}).get('active')) > 0
    t['src'].add('ds')
    return t

def ds_tokens(net, addrs):
    """DexScreener pairs for up to N token addresses (batches of 30). Best pair per token by liquidity."""
    chain = NET2DS.get(net, net); best = {}
    for i in range(0, len(addrs), 30):
        b = addrs[i:i + 30]
        d = get_json(f'{DS}/tokens/v1/{chain}/' + ','.join(b))
        if d is None: d = get_json(f'{DS}/latest/dex/tokens/' + ','.join(b))
        pairs = d if isinstance(d, list) else ((d or {}).get('pairs') or [] if isinstance(d, dict) else [])
        want = {x.lower() for x in b}
        for p in pairs:
            try:
                if p.get('chainId') != chain: continue
                a = str((p.get('baseToken') or {}).get('address', '')).lower()
                if a not in want: continue
                if a not in best or num((p.get('liquidity') or {}).get('usd')) > num((best[a].get('liquidity') or {}).get('usd')):
                    best[a] = p
            except Exception:
                continue
    return best

def merge_tok(old, new):
    keep, other = (new, old) if new['liq'] > old['liq'] else (old, new)
    keep['trend'] |= other['trend']; keep['src'] |= other['src']
    keep['socials'] = max(keep['socials'], other['socials']); keep['boosted'] |= other['boosted']
    return keep

def collect():
    toks = {}
    def add(t):
        k = (t['net'], t['token'].lower())
        toks[k] = merge_tok(toks[k], t) if k in toks else t
    for net in NETWORKS:
        for dur in ('1h', '6h'):
            for t in gt_pools(net, 'trending_pools', {'duration': dur}):
                t['trend'].add(dur); add(t)
        for t in gt_pools(net, 'new_pools'):
            t['trend'].add('new'); add(t)
    chain2net = {NET2DS.get(n, n): n for n in NETWORKS}
    extra = {}
    for url, tag in ((f'{DS}/token-boosts/latest/v1', 'boost'), (f'{DS}/token-profiles/latest/v1', 'profile')):
        d = get_json(url)
        for x in (d if isinstance(d, list) else []):
            net = chain2net.get(x.get('chainId')); addr = x.get('tokenAddress')
            if net and addr: extra.setdefault(net, {})[addr] = tag
    # enrich every candidate (socials, boosts) and add DexScreener-only candidates
    for net in NETWORKS:
        addrs = {t['token'] for (n, _), t in toks.items() if n == net}
        addrs |= set(extra.get(net, {}))
        if not addrs: continue
        best = ds_tokens(net, sorted(addrs))
        for a, p in best.items():
            dt = ds_to_tok(p, net)
            k = (net, a)
            if k in toks:
                t = toks[k]
                t['socials'] = max(t['socials'], dt['socials']); t['boosted'] |= dt['boosted']
                if dt['pool'].lower() == t['pool'].lower() and dt['liq'] > 0:
                    t['liq'] = min(x for x in (t['liq'], dt['liq']) if x > 0)    # conservative cross-check
            else:
                if extra.get(net, {}).get(dt['token']) == 'boost': dt['boosted'] = True
                toks[k] = dt
    return list(toks.values())

def gt_ohlcv(net, pool, tf, agg, limit):
    d = get_json(f'{GT}/networks/{net}/pools/{pool}/ohlcv/{tf}',
                 {'aggregate': agg, 'limit': limit, 'currency': 'usd'}, headers=GT_HEADERS)
    try: lst = d['data']['attributes']['ohlcv_list']
    except (TypeError, KeyError): return []
    out = [{'t': int(x[0]), 'o': num(x[1]), 'h': num(x[2]), 'l': num(x[3]), 'c': num(x[4]), 'v': num(x[5])}
           for x in lst if isinstance(x, list) and len(x) >= 6]
    out.sort(key=lambda x: x['t'])
    return out

# ------------------------------------------------------------ pre-gate ---
def buy_ratio(t, w):
    x = t['tx'].get(w) or {}; b, s = x.get('buys', 0), x.get('sells', 0)
    return b / (b + s) if b + s else 0.5

def vol_accel(t):
    v1, v6 = t['vol'].get('h1', 0), t['vol'].get('h6', 0)
    base = (v6 - v1) / 5
    return v1 / base if base > 0 else 1.0

def pre_gate(t):
    c = t['chg']
    if t['price'] <= 0: return 'no price'
    if t['liq'] < MIN_LIQ: return f'liquidity {usd(t["liq"])} < {usd(MIN_LIQ)}'
    if t['vol'].get('h24', 0) < MIN_VOL24: return 'low 24h volume'
    if t['created'] and (time.time() - t['created']) / 60 < MIN_AGE_MIN: return 'pool too new'
    if c.get('h1', 0) > MAX_H1 or c.get('h6', 0) > MAX_H6 or c.get('h24', 0) > MAX_H24: return 'already pumped (late)'
    if c.get('m5', 0) < -3: return 'dumping right now'
    x = t['tx'].get('h1') or {}
    if x.get('sells', 0) > 1.6 * max(x.get('buys', 0), 1) and x.get('sells', 0) > 30: return 'heavy sell pressure'
    return None

def quick_rank(t):
    h1 = t['chg'].get('h1', 0)
    return (clip01((vol_accel(t) - 1) / 4) * 50 + clip01((buy_ratio(t, 'h1') - .5) / .15) * 30
            + (20 if 0 <= h1 <= 12 else 5))

# ------------------------------------------------------- candle analysis ---
def analyze(c15, c1h, price):
    an = {}
    cl = [x['c'] for x in c15]
    an['ema20'] = ema(cl, 20)[-1]; an['rsi'] = rsi(cl)
    def bw(w):
        m = sum(w) / len(w)
        sd = math.sqrt(sum((x - m) ** 2 for x in w) / len(w))
        return (4 * sd / m) if m else 0.0
    bws = [bw(cl[i - 20:i]) for i in range(20, len(cl) + 1)]
    hist = sorted(bws[-96:])
    an['squeeze'] = len(hist) >= 30 and bws[-1] <= hist[len(hist) // 4]
    m = sum(cl[-20:]) / 20
    sd = math.sqrt(sum((x - m) ** 2 for x in cl[-20:]) / 20)
    an['bb_break'] = cl[-1] > m + 2 * sd
    v = [x['v'] for x in c15]
    an['vol_ratio'] = None
    if len(v) >= 40:
        base = sum(v[-100:-4]) / max(1, len(v[-100:-4])) * 4
        if base > 0: an['vol_ratio'] = sum(v[-4:]) / base
    trs = [max(c15[i]['h'] - c15[i]['l'], abs(c15[i]['h'] - c15[i - 1]['c']), abs(c15[i]['l'] - c15[i - 1]['c']))
           for i in range(len(c15) - 14, len(c15))]
    an['atr'] = sum(trs) / len(trs)
    an['support'] = min(x['l'] for x in c15[-16:])
    highs = [x['h'] for x in c1h]
    swings = [highs[i] for i in range(6, len(highs) - 6) if highs[i] == max(highs[i - 6:i + 7])]
    top = max(highs[:-3]) if len(highs) > 6 else max(highs)
    above = [s for s in swings + [top] if s > price * 1.01]
    an['res'] = min(above) if above else None
    an['room'] = (an['res'] / price - 1) * 100 if an['res'] else None
    an['open_space'] = an['res'] is None
    an['prior_high'] = top
    an['breakout'] = price > top * 0.998 and (an['vol_ratio'] or 0) >= 2
    an['hist_hours'] = len(c1h)
    an['ext_pct'] = (price / an['ema20'] - 1) * 100 if an['ema20'] else 0
    return an

def make_levels(price, an):
    """ATR/swing-low stop; targets are R-multiples but must fit under the nearest resistance."""
    sl = min(an['support'] * 0.995, price - 1.2 * an['atr'])
    sl = min(sl, price * (1 - MIN_RISK)); sl = max(sl, price * (1 - MAX_RISK))
    risk = price - sl
    if risk <= 0: return None, 'invalid stop'
    mult = [RR_MIN, RR_MIN + 1.5, RR_MIN + 4]
    tps = [price + m * risk for m in mult]
    if an['res']:
        cap = an['res'] * 0.985
        tps = [x for x in tps if x <= cap]
        if not tps:
            return None, (f'resistance only {an["room"]:.1f}% above: TP1 ({RR_MIN}R = '
                          f'{RR_MIN * risk / price * 100:.1f}%) would sit beyond it')
    return {'entry': price, 'sl': sl, 'tps': tps, 'risk_pct': risk / price * 100}, None

# ------------------------------------------------------------- safety etc ---
def safety(t):
    net, token = t['net'], t['token']
    try:
        if net == 'solana':
            d = get_json(f'https://api.rugcheck.xyz/v1/tokens/{token}/report/summary')
            if not isinstance(d, dict): return None
            risks = d.get('risks') or []
            danger = [str(r.get('name')) for r in risks if str(r.get('level', '')).lower() == 'danger']
            warn = [str(r.get('name')) for r in risks if str(r.get('level', '')).lower() == 'warn']
            return {'src': 'RugCheck', 'danger': danger, 'warn': warn, 'block': bool(d.get('rugged')) or len(danger) >= 3}
        if net in EVM_ID:
            d = get_json('https://api.honeypot.is/v2/IsHoneypot', {'address': token, 'chainID': EVM_ID[net]})
            if not isinstance(d, dict) or 'honeypotResult' not in d: return None
            hp = bool((d.get('honeypotResult') or {}).get('isHoneypot'))
            sim = d.get('simulationResult') or {}
            buy, sell = num(sim.get('buyTax')), num(sim.get('sellTax'))
            danger = (['honeypot'] if hp else []) + ([f'sell tax {sell:.0f}%'] if sell > 10 else []) + ([f'buy tax {buy:.0f}%'] if buy > 10 else [])
            warn = [f'tax buy {buy:.0f}% / sell {sell:.0f}%'] if (buy >= 5 or sell >= 5) and not danger else []
            return {'src': 'honeypot.is', 'danger': danger, 'warn': warn, 'block': bool(danger)}
    except Exception as e:
        log(f'safety check error {token[:8]}: {e}')
    return None

_llama = {}
def llama_data():
    if 'v' in _llama: return _llama['v']
    out = {'by_sym': {}, 'cat': {}}
    d = get_json('https://api.llama.fi/protocols', timeout=45) if ENABLE_LLAMA else None
    if isinstance(d, list):
        cats = {}
        for p in d:
            sym = str(p.get('symbol') or '').upper()
            if sym and sym != '-': out['by_sym'].setdefault(sym, []).append(p)
            if num(p.get('tvl')) > 1e6 and p.get('category') is not None:
                cats.setdefault(p['category'], []).append(num(p.get('change_7d')))
        out['cat'] = {k: sum(v) / len(v) for k, v in cats.items() if len(v) >= 3}
    _llama['v'] = out
    return out

def llama_match(t):
    data = llama_data(); chains = LLAMA_CHAIN.get(t['net'], [])
    best = None
    for p in data['by_sym'].get(t['symbol'].upper(), []):
        if not any(c in (p.get('chains') or []) for c in chains) or num(p.get('tvl')) < 1e5: continue
        pm, tm = num(p.get('mcap')), t['mcap'] or t['fdv']
        if pm > 0 and tm > 0 and not (1 / 3 <= pm / tm <= 3): continue       # symbol clone with a different size
        if best is None or num(p.get('tvl')) > num(best.get('tvl')): best = p
    if not best: return None
    tvl = num(best.get('tvl')); mcap = num(best.get('mcap')) or t['mcap'] or t['fdv']
    return {'name': best.get('name'), 'tvl': tvl, 'd1': num(best.get('change_1d')), 'd7': num(best.get('change_7d')),
            'cat': best.get('category'), 'cat_mom': data['cat'].get(best.get('category')),
            'mcap_tvl': (mcap / tvl) if tvl and mcap else None}

