name: BINANCE GEMS Pre-Pump Radar

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-gems-prepump-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BINANCE GEMS radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: '45'
          MAX_WORKERS: '8'
          SQUARE_POST_DELAY_SECONDS: '45'
        run: python crypto_signal_bot.py

      - name: Upload Square drafts and original charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-gems-square-drafts-${{ github.run_number }}
          path: |
            square_drafts.txt
            square_charts/
            pre_pump_ranking_*.csv
          if-no-files-found: warn
          retention-days: 7
